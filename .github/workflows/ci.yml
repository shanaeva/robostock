name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: ESLint
        run: pnpm --filter frontend lint

      - name: TypeScript
        run: pnpm --filter frontend exec tsc --noEmit

      - name: FSD architecture check
        run: pnpm --filter frontend fsd:check

      - name: Build
        run: pnpm --filter frontend build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://starter:starter_local_only@localhost:5432/robostock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm --filter backend lint

      - name: TypeScript
        run: pnpm --filter backend typecheck

      - name: Build
        run: pnpm --filter backend build

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter_local_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://starter:starter_local_only@localhost:5432/robostock
      TEST_DATABASE_ADMIN_URL: postgresql://starter:starter_local_only@localhost:5432/postgres
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters-long
      AUTH_CODE_SECRET: ci-test-auth-code-secret-32-characters-ok
      CSRF_SECRET: ci-test-csrf-secret-at-least-32-characters
      AUTH_RATE_LIMIT_ENABLED: 'false'
      AUTH_EMAIL_ENABLED: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm --filter backend test

      - name: Run e2e tests
        run: pnpm --filter backend test:e2e
